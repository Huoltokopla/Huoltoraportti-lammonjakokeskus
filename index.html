</main><script>
const WORKERS_KEY='ljk-workers';
function getWorkers(){try{return JSON.parse(localStorage.getItem(WORKERS_KEY)||'[]')}catch(e){return[]}}
function renderWorkers(selected=''){const sel=document.getElementById('worker');if(!sel)return;const workers=getWorkers();sel.innerHTML='<option value="">Valitse suorittaja</option>'+workers.map(n=>'<option value="'+n.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')+'">'+n.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</option>').join('');if(selected&&workers.includes(selected))sel.value=selected}
function addWorker(){const name=prompt('Anna suorittajan nimi:');if(!name||!name.trim())return;const clean=name.trim();const workers=getWorkers();if(!workers.includes(clean)){workers.push(clean);workers.sort((a,b)=>a.localeCompare(b,'fi'));localStorage.setItem(WORKERS_KEY,JSON.stringify(workers))}renderWorkers(clean)}
function removeWorker(){const sel=document.getElementById('worker');if(!sel||!sel.value)return;const name=sel.value;if(!confirm('Poistetaanko suorittaja '+name+'?'))return;const workers=getWorkers().filter(n=>n!==name);localStorage.setItem(WORKERS_KEY,JSON.stringify(workers));renderWorkers('')}
function autoGrow(el){if(!el)return;el.style.height='auto';el.style.height=Math.max(100,el.scrollHeight)+'px'}
function initAutoGrow(root=document){root.querySelectorAll('textarea').forEach(el=>{autoGrow(el);el.addEventListener('input',()=>autoGrow(el))})}
const taskNames=['Lämmön siirtimien tarkastus','Säätöventtiilien tarkastus','Kiertovesipumppujen tarkastus','Taajuusmuuttajan tarkastus','Paisunta-astian esipaineen tarkastus','Varoventtiilien koestus','Sulkuventtiilien toiminta','Suodattimen tarkastus','Lianerottimen puhdistus ja tiivisteen vaihto','Vuototarkastus','Mittareiden toiminta','Säätökäyrän ja asetusarvojen tarkastus','Jatkohälytyksien koestus'];
const measureNames=['Menoveden lämpötila (°C)','Paluuveden lämpötila (°C)','Verkoston paine ennen huoltoa (bar)','Verkoston paine huollon jälkeen (bar)'];
const tasks=document.getElementById('tasks');taskNames.forEach((n,i)=>tasks.insertAdjacentHTML('beforeend',`<tr><td>${n}</td><td class="condition"><label><input class="status condition-choice" type="radio" name="t${i}" value="yes"> Kyllä</label><label><input class="status condition-choice" type="radio" name="t${i}" value="no"> Ei</label></td><td><input class="status none-choice" type="checkbox" data-task="${i}"></td><td>${n==='Suodattimen tarkastus'?'<label class="filter-changed"><input type="checkbox" class="filter-changed-box"> Vaihdettu</label>':''}<input data-note="${i}"></td></tr>`));
const measures=document.getElementById('measures');measureNames.forEach((n,i)=>measures.insertAdjacentHTML('beforeend',`<tr><td>${n}</td>${Array.from({length:6},(_,j)=>`<td><input type="number" step="0.1" data-m="${i}-${j}"></td>`).join('')}</tr>`));
const ids=['worker','date','address','property','year','heating','circuits','outtemp','faults','recommendations'];
function collect(){let d={};ids.forEach(id=>d[id]=document.getElementById(id).value);d.tasks=taskNames.map((_,i)=>({status:document.querySelector(`.none-choice[data-task="${i}"]`)?.checked?'none':(document.querySelector(`input[name=t${i}]:checked`)?.value||''),note:document.querySelector(`[data-note="${i}"]`).value,changed:!!document.querySelector(`.none-choice[data-task="${i}"]`)?.closest('tr')?.querySelector('.filter-changed-box')?.checked}));d.measures={};document.querySelectorAll('#page2Content [data-m]').forEach(e=>d.measures[e.dataset.m]=e.value);d.extraPages=collectExtraPages();d.photos=[...document.querySelectorAll('#photos .photo')].map(p=>({src:p.querySelector('img')?.src||'',caption:p.querySelector('input')?.value||''})).filter(p=>p.src);return d}
function saveLocal(){try{const d=collect();const ref={name:[d.address,finnishDate(d.date)].filter(Boolean).join(' - '),savedAt:new Date().toISOString()};localStorage.setItem('ljk-report-ref',JSON.stringify(ref));alert('Raportin tunniste tallennettu. Varsinaista raporttia kuvineen ei tallenneta selaimen localStorageen.')}catch(e){console.warn('Tunnisteen tallennus epäonnistui',e);alert('Raportin tunnistetta ei voitu tallentaa, mutta lomakkeen käyttöä voi jatkaa.')}}
function loadLocal(){try{localStorage.removeItem('ljk-report')}catch(e){console.warn('Vanhan välitallennuksen poisto epäonnistui',e)}}
async function fetchOutdoorTemperature(root=document){
 const btn=root.querySelector('.weather-btn')||root.querySelector('#weatherBtn'),out=root.querySelector('.outtemp-input')||root.querySelector('#outtemp'); if(btn){btn.disabled=true;btn.textContent='Haetaan...'}
 try{let lat,lon; const address=(document.getElementById('address')?.value||'').trim();
