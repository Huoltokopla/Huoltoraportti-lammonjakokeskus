header{position:relative;padding-top:54px}

.top-actions button{white-space:nowrap}
.report-search{max-width:760px;margin:8px 0 18px auto}
.report-result{position:relative;padding-right:48px}
.report-result-delete{position:absolute;right:8px;top:8px;width:32px;height:32px;padding:0;border-radius:50%;background:#b42318;color:#fff;font-size:22px;line-height:32px;text-align:center}
.report-result-delete:hover{background:#8f1810}

const WORKERS_KEY='ljk-workers';
function getWorkers(){try{return JSON.parse(localStorage.getItem(WORKERS_KEY)||'[]')}catch(e){return[]}}
function renderWorkers(selected=''){const sel=document.getElementById('worker');if(!sel)return;const workers=getWorkers();sel.innerHTML='<option value="">Valitse suorittaja</option>'+workers.map(n=>'<option value="'+n.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')+'">'+n.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</option>').join('');if(selected&&workers.includes(selected))sel.value=selected}
function addWorker(){const name=prompt('Anna suorittajan nimi:');if(!name||!name.trim())return;const clean=name.trim();const workers=getWorkers();if(!workers.includes(clean)){workers.push(clean);workers.sort((a,b)=>a.localeCompare(b,'fi'));localStorage.setItem(WORKERS_KEY,JSON.stringify(workers))}renderWorkers(clean)}
function removeWorker(){const sel=document.getElementById('worker');if(!sel||!sel.value)return;const name=sel.value;if(!confirm('Poistetaanko suorittaja '+name+'?'))return;const workers=getWorkers().filter(n=>n!==name);localStorage.setItem(WORKERS_KEY,JSON.stringify(workers));renderWorkers('')}
function autoGrow(el){if(!el)return;el.style.height='auto';el.style.height=Math.max(100,el.scrollHeight)+'px'}
function initAutoGrow(root=document){root.querySelectorAll('textarea').forEach(el=>{autoGrow(el);el.addEventListener('input',()=>autoGrow(el))})}

async function fetchOutdoorTemperature(root=document){
 const btn=root.querySelector('.weather-btn')||root.querySelector('#weatherBtn'),out=root.querySelector('.outtemp-input')||root.querySelector('#outtemp'); if(btn){btn.disabled=true;btn.textContent='Haetaan...'}
 try{let lat,lon; const address=(document.getElementById('address')?.value||'').trim();
  if(address){try{const q=/\bfinland\b|\bsuomi\b/i.test(address)?address:address+', Finland';const g=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=fi&q='+encodeURIComponent(q),{headers:{'Accept-Language':'fi'}});if(g.ok){const j=await g.json();if(j[0]){lat=+j[0].lat;lon=+j[0].lon}}}catch(e){}}
  if(!Number.isFinite(lat)||!Number.isFinite(lon)){if(!navigator.geolocation)throw Error();const p=await new Promise((r,j)=>navigator.geolocation.getCurrentPosition(r,j,{enableHighAccuracy:true,timeout:12000,maximumAge:60000}));lat=p.coords.latitude;lon=p.coords.longitude}
  const w=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m&timezone=auto');const j=await w.json();if(!j.current||typeof j.current.temperature_2m!=='number')throw Error();out.value=(+j.current.temperature_2m).toFixed(1)
 }catch(e){alert('Ulkolämpötilaa ei saatu automaattisesti. Tarkista osoite tai salli laitteen sijainti. Voit syöttää lämpötilan myös käsin.')}finally{if(btn){btn.disabled=false;btn.textContent='Hae lämpötila'}}
}
function updatePrintMeasurementColumns(){
  document.querySelectorAll('table.measure').forEach(table=>{
    const rows=[...table.rows]; if(!rows.length)return;
    [...rows[0].cells].forEach(c=>c.classList.remove('pdf-hide-col'));
    for(let col=1;col<rows[0].cells.length;col++){
      const used=rows.slice(1).some(r=>{const input=r.cells[col]?.querySelector('input');return input&&String(input.value).trim()!=='';});
      rows.forEach(r=>{if(r.cells[col])r.cells[col].classList.toggle('pdf-hide-col',!used);});
    }
  });
}

 const ok=confirm('Haluatko varmasti poistaa tämän SharePoint-tiedoston?\n\n'+name+'\n\nPoistoa ei voi perua tästä sovelluksesta.');if(!ok)return;
 try{setReportSearchStatus('Poistetaan tiedostoa...','busy');const sid=await siteId();await graphFetch('https://graph.microsoft.com/v1.0/sites/'+encodeURIComponent(sid)+'/drive/items/'+encodeURIComponent(itemId),{method:'DELETE'});row?.remove();setReportSearchStatus('Tiedosto poistettiin: '+name,'ok');if(!document.querySelector('#reportResults .report-result'))setReportSearchStatus('Hakutuloksia ei ole jäljellä.')}catch(e){console.error(e);setReportSearchStatus('Tiedoston poistaminen epäonnistui','error');alert('Tiedoston poistaminen SharePointista epäonnistui.\n\n'+(e.message||e))}}
async function openSharePointReport(itemId,name,mode='edit'){
 try{setReportSearchStatus(mode==='clone'?'Luodaan uutta huoltoa...':'Avataan raporttia...','busy');const sid=await siteId();const meta=await(await graphFetch('https://graph.microsoft.com/v1.0/sites/'+encodeURIComponent(sid)+'/drive/items/'+encodeURIComponent(itemId)+'?$select=@microsoft.graph.downloadUrl')).json();if(!meta['@microsoft.graph.downloadUrl'])throw Error('Raportin latausosoitetta ei saatu.');const r=await fetch(meta['@microsoft.graph.downloadUrl']);if(!r.ok)throw Error('Raportin lataus epäonnistui: '+r.status);const d=await r.json();
 if(mode==='clone'){
   const resetTask=t=>({...t,status:t.status==='none'?'none':'',changed:false});
   d.tasks=(d.tasks||[]).map(resetTask);
   d.extraPages=(d.extraPages||[]).map(page=>({...page,tasks:(page.tasks||[]).map(resetTask)}));
  }
  applyReportData(d);localStorage.setItem('ljk-report',JSON.stringify(d));setReportSearchStatus((mode==='clone'?'Uusi huolto luotu raportin pohjalta: ':'Avattu muokattavaksi: ')+name,'ok');window.scrollTo({top:0,behavior:'smooth'})}catch(e){console.error(e);setReportSearchStatus('Raportin avaaminen epäonnistui','error');alert('Raportin avaaminen epäonnistui.\n\n'+(e.message||e))}}
function restoreReportPhotos(items){const holder=document.getElementById('photos');if(!holder)return;holder.innerHTML='';(items||[]).forEach(item=>{if(!item?.src)return;const card=document.createElement('div');card.className='photo';card.innerHTML=`<img src="${item.src}" alt="Liitetty kuva"><input placeholder="Kuvateksti"><button class="secondary no-print" type="button">Poista</button>`;card.querySelector('input').value=item.caption||'';card.querySelector('button').onclick=()=>card.remove();holder.appendChild(card)})}
  function applyReportData(d){renderWorkers(d.worker||'');ids.forEach(id=>{const el=document.getElementById(id);if(el)el.value=d[id]||''});taskNames.forEach((_,i)=>{const task=(d.tasks||[])[i]||{};const none=document.querySelector(`.none-choice[data-task="${i}"]`),yes=document.querySelector(`input[name=t${i}][value="yes"]`),no=document.querySelector(`input[name=t${i}][value="no"]`),note=document.querySelector(`[data-note="${i}"]`),changed=none?.closest('tr')?.querySelector('.filter-changed-box');if(none)none.checked=task.status==='none';if(yes)yes.checked=task.status==='yes';if(no)no.checked=task.status==='no';if(note)note.value=task.note||'';if(changed)changed.checked=!!task.changed;if(none)syncTaskRow(none.closest('tr'))});document.querySelectorAll('#page2Content [data-m]').forEach(e=>e.value='');Object.entries(d.measures||{}).forEach(([k,v])=>{const e=document.querySelector(`#page2Content [data-m="${k}"]`);if(e)e.value=v});restoreReportPhotos(d.photos||[]);restoreExtraPages(d.extraPages||[]);document.querySelectorAll('textarea').forEach(autoGrow)}
  let originalDocumentTitle=document.title,originalReportHeading=''; function pdfReportLabel(){const address=(document.getElementById('address')?.value||'').trim(),date=finnishDate(document.getElementById('date')?.value||'');return ['Lämmönjakokeskuksen huoltoraportti',address,date].filter(Boolean).join(' - ')} function preparePdfTitle(){const label=pdfReportLabel(),heading=document.querySelector('header h1');if(heading){originalReportHeading=heading.textContent;heading.textContent=label}document.title=label} function restorePdfTitle(){const heading=document.querySelector('header h1');if(heading&&originalReportHeading)heading.textContent=originalReportHeading;document.title=originalDocumentTitle} function savePdf(){preparePdfTitle();setTimeout(()=>window.print(),50)}
